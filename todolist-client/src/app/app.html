<div style="max-width: 500px; margin: 20px auto; font-family: sans-serif;">
  <h1>📝 Todolist (démo CORS)</h1>

  <label>
    Votre nom :
    <input [(ngModel)]="nomUtilisateur" (change)="chargerTaches()" placeholder="ex: alice" />
  </label>

  <hr />

  <h3>Ajouter une tâche</h3>
  <input [(ngModel)]="nouvelleTache.descTache" placeholder="Description" />
  <input type="number" [(ngModel)]="nouvelleTache.prioTache" placeholder="Priorité" />
  <button (click)="ajouter()">Ajouter</button>

  <hr />

  <h3>Mes tâches ({{ nomUtilisateur || '...' }})</h3>
  <ul>
    <li *ngFor="let t of taches">
      <input type="checkbox" [checked]="t.doneTache" (change)="toggle(t)" />
      <span [style.textDecoration]="t.doneTache ? 'line-through' : 'none'">
        {{ t.descTache }} (priorité : {{ t.prioTache }})
      </span>
      <button (click)="supprimer(t.idTache!)">🗑️</button>
    </li>
  </ul>
</div>
